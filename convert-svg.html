<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 上传并绘制到 Canvas (单文件版)</title>

    <!-- CSS 样式直接嵌入到 HTML 中 -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #1a2533;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .upload-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .upload-btn:active {
            background-color: #004494;
            transform: translateY(0);
        }

        #myCanvas {
            margin-top: 20px;
            border: 2px dashed #dddddd;
            border-radius: 8px;
            /* 确保 canvas 在容器内响应式显示 */
            max-width: 100%; 
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SVG to Canvas 转换器</h1>
        <p>请选择一个本地的 SVG 文件，它将被绘制到下方的 Canvas 画布上。</p>

        <!-- 隐藏的原始文件输入框 -->
        <input type="file" id="svgUploader" accept="image/svg+xml" style="display: none;">

        <div id="svgPreview" style="display: none;"></div>
        
        <!-- 美化后的上传按钮，通过 label 关联 input -->
        <label for="svgUploader" class="upload-btn">选择 SVG 文件</label>

        <h2 id="canvas-title" style="display: block;">Canvas 预览:</h2>
        <!-- 用于绘制 SVG 的 Canvas 元素 -->
        <canvas id="myCanvas"></canvas>
    </div>

    <!-- JavaScript 逻辑直接嵌入到 HTML 中 -->
    <script>
        // 等待文档加载完毕
        document.addEventListener('DOMContentLoaded', () => {

            // 获取 DOM 元素
            const uploader = document.getElementById('svgUploader');
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');
            const canvasTitle = document.getElementById('canvas-title');

            // 监听文件选择器的 change 事件
            uploader.addEventListener('change', (event) => {
                // 获取用户选择的第一个文件
                const file = event.target.files[0];

                if (!file) {
                    console.log("没有选择文件。");
                    return;
                }

                // 验证文件类型是否为 SVG
                if (file.type !== 'image/svg+xml') {
                    alert('请上传一个有效的 SVG 文件！');
                    uploader.value = ''; // 清空选择，以便重新上传
                    return;
                }

                // 使用 FileReader API 来读取文件内容
                const reader = new FileReader();

                // 当文件读取成功时触发
                reader.onload = (e) => {
                    // e.target.result 包含了 SVG 文件的文本内容
                    const svgText = e.target.result;
                    
                    // --- 核心步骤（最终完美版） ---
                    // 这是在 JavaScript 中对 UTF-8 字符串进行 Base64 编码的标准可靠方法。
                    // 1. 使用 encodeURIComponent 对 UTF-8 字符串进行编码，处理多字节字符。
                    // 2. 使用 unescape 将百分比编码转换为单字节字符。
                    // 3. 使用 btoa() 进行 Base64 编码。
                    const svgBase64 = btoa(unescape(encodeURIComponent(svgText)));

                    // 2. 构建 Base64 格式的 Data URI。
                    const dataUri = 'data:image/svg+xml;base64,' + svgBase64;

                    // 3. 创建一个新的 Image 对象
                    const img = new Image();
                    
                    // 4. 当图片从 Base64 Data URI 加载完成后执行绘制操作
                    img.onload = () => {
                        // 确保使用最可靠的方式设置 Canvas 宽高
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;

                        // 清空 Canvas 之前的内容
                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        // 将加载好的 SVG 图像绘制到 Canvas 上
                        ctx.drawImage(img, 0, 0);
                    };

                    // 5. 处理加载错误
                    img.onerror = (err) => {
                        alert('无法加载 SVG 图像。请检查文件格式或浏览器控制台以获取详细错误。');
                        console.log(dataUri)
                        console.error("加载 SVG Data URI 时出错:", err);
                    };
                    
                    // 6. 将 Base64 Data URI 赋值给 Image 对象的 src 属性，开始加载
                    img.src = dataUri;
                };
                
                // 以文本形式读取文件
                reader.readAsText(file);
            });
        });
    </script>

</body>
</html>
